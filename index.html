<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whydie Pall V1</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Monospace & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Style CSS Utama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- Video Header -->
        <div class="video-card">
            <video class="card-video" autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Section Teks Welcome -->
        <div class="text-section" id="welcomeText">
            <h2>Welcome to Whydie Pall</h2>
            <p>Please log in or register to continue</p>
        </div>

        <!-- Menu Utama Simple -->
        <div class="menu-box" id="menuBox">
            <button class="btn-menu" onclick="openLoginForm()">Login</button>
            <button class="btn-menu" onclick="openRegisterForm()">Register</button>
        </div>

        <!-- FORM KHUSUS LOGIN -->
        <div class="form-card" id="loginFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Login Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <button type="button" class="submit-btn" onclick="handleLogin()">LOGIN</button>
            <button type="button" class="btn-close" onclick="closeAllForms()">&larr; Kembali ke menu utama</button>
        </div>

        <!-- FORM KHUSUS REGISTER -->
        <div class="form-card" id="registerFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Create Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="regConfirmPassword" class="form-input" placeholder="Ulangi password">
            </div>

            <button type="button" class="submit-btn" onclick="handleRegister()">REGISTER</button>
            <button type="button" class="btn-close" onclick="closeAllForms()">&larr; Kembali ke menu utama</button>
        </div>

        <!-- DASHBOARD PANEL LENGKAP -->
        <div class="dashboard-card" id="dashboardCard">
            <div class="neon-diamond"></div>
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>PANEL</span></div>
                <div class="brand-subtitle">Welcome back, <span id="userDisplay" style="color:#00d2ff; font-weight: bold;">User</span>!</div>
            </div>

            <!-- Ringkasan Statistik -->
            <div class="dashboard-stats" style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">
                <div style="flex: 1; background: #090a0d; border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; text-align: center;">
                    <span style="font-size: 10px; color: #8a94a6;">STATUS</span>
                    <p style="font-size: 12px; color: #00ff88; font-weight: bold; margin-top: 4px;">ACTIVE</p>
                </div>
                <div style="flex: 1; background: #090a0d; border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; text-align: center;">
                    <span style="font-size: 10px; color: #8a94a6;">TOTAL REPORT</span>
                    <p style="font-size: 12px; color: #00d2ff; font-weight: bold; margin-top: 4px;">128</p>
                </div>
            </div>

            <!-- Form Submit Report -->
            <div class="form-group">
                <label class="form-label">Target Account / URL</label>
                <input type="text" class="form-input" placeholder="https://tiktok.com/@target">
            </div>

            <div class="form-group">
                <label class="form-label">Report Category</label>
                <select class="form-input" style="background: #090a0d; color: #fff;">
                    <option>Spam / Fake Account</option>
                    <option>Harassment / Bullying</option>
                    <option>Inappropriate Content</option>
                </select>
            </div>

            <button type="button" class="submit-btn" style="margin-bottom: 15px;" onclick="alert('Report submitted successfully!')">SEND REPORT</button>

            <button type="button" class="logout-btn" onclick="handleLogout()">LOGOUT</button>
        </div>

        <!-- Contact Section -->
        <div class="contact-box">
            <span>Contact Us</span>
            <div class="social-icons">
                <a href="https://t.me/mrwhy016" target="_blank" class="icon-circle" title="Telegram">
                    <i class="fa-paper-plane fas"></i>
                </a>
                <a href="https://www.tiktok.com/@wildan,aj,bre" target="_blank" class="icon-circle tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 Whydie Pall
            </div>
        </div>

    </div>

    <!-- Script JavaScript Utama -->
    <script src="script.js"></script>

</body>
</html>
