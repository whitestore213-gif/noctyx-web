<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whydie Pall V1</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Monospace & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: #000000;
            color: #d8d8d8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .main-container {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Banner Video Minimalis */
        .video-card {
            width: 100%;
            height: 170px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        .card-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Text Welcome */
        .text-section {
            text-align: center;
            margin: 2px 0;
        }

        .text-section h2 {
            font-size: 20px;
            color: #ffffff;
            letter-spacing: 1px;
            font-weight: normal;
        }

        .text-section p {
            font-size: 11px;
            color: #777777;
            margin-top: 6px;
        }

        /* Menu Simple */
        .menu-box {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0a0a0a;
        }

        .btn-menu {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-menu:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Form Card & Dashboard Card */
        .form-card {
            display: none;
            width: 100%;
            background: #12141a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px 20px;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            font-family: 'Inter', sans-serif;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-card.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .neon-diamond {
            width: 14px;
            height: 14px;
            background: #00d2ff;
            transform: rotate(45deg);
            box-shadow: 0 0 12px #00d2ff;
            margin-bottom: 12px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .brand-title span {
            color: #00d2ff;
            font-size: 12px;
            margin-left: 4px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #6c757d;
            margin-top: 4px;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
            text-align: left;
        }

        .form-label {
            font-size: 10px;
            font-weight: 600;
            color: #8a94a6;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }

        .form-input {
            width: 100%;
            background: #090a0d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 11px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            border-color: #00d2ff;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #00d2ff;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: #6c757d;
            font-size: 11px;
            margin-top: 14px;
            cursor: pointer;
            text-decoration: underline;
            font-family: 'Inter', sans-serif;
        }

        /* Contact Section */
        .contact-box {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: #0a0a0a;
        }

        .contact-box span {
            font-size: 12px;
            color: #aaaaaa;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0088cc;
            font-size: 20px;
            text-decoration: none;
        }

        .icon-circle.tiktok {
            color: #000000;
        }

        .copyright {
            font-size: 10px;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Video Header -->
        <div class="video-card">
            <video class="card-video" autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Section Teks Welcome -->
        <div class="text-section" id="welcomeText">
            <h2>Welcome to Whydie Pall</h2>
            <p>Please log in or register to continue</p>
        </div>

        <!-- Menu Simple Utama -->
        <div class="menu-box" id="menuBox">
            <button type="button" class="btn-menu" id="loginBtn">Login</button>
            <button type="button" class="btn-menu" id="regBtn">Register</button>
        </div>

        <!-- FORM KHUSUS LOGIN -->
        <div class="form-card" id="loginFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Login Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <button type="button" class="submit-btn" id="submitLoginBtn">LOGIN</button>
            <button type="button" class="btn-close" id="closeLoginBtn">&larr; Kembali ke menu utama</button>
        </div>

        <!-- FORM KHUSUS REGISTER -->
        <div class="form-card" id="registerFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Create Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="regConfirmPassword" class="form-input" placeholder="Ulangi password">
            </div>

            <button type="button" class="submit-btn" id="submitRegBtn">REGISTER</button>
            <button type="button" class="btn-close" id="closeRegBtn">&larr; Kembali ke menu utama</button>
        </div>

        <!-- DASHBOARD PANEL CARD -->
        <div class="form-card" id="dashboardCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Dashboard Panel</div>
            </div>

            <div style="text-align: center; margin-bottom: 20px; font-family: 'Inter', sans-serif;">
                <p style="font-size: 14px; color: #ffffff;">Selamat Datang, <span id="dashUser" style="color: #00d2ff; font-weight: bold;">User</span>!</p>
                <p style="font-size: 11px; color: #00ff88; margin-top: 6px;">Status: Active</p>
            </div>

            <button type="button" class="submit-btn" style="background: #ff4d4d; color: #ffffff;" id="logoutBtn">LOGOUT</button>
        </div>

        <!-- Contact Section -->
        <div class="contact-box">
            <span>Contact Us</span>
            <div class="social-icons">
                <a href="https://t.me/mrwhy016" target="_blank" class="icon-circle" title="Telegram">
                    <i class="fa-paper-plane fas"></i>
                </a>
                <a href="https://www.tiktok.com/@wildan,aj,bre" target="_blank" class="icon-circle tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 Whydie Pall
            </div>
        </div>

    </div>

    <!-- Script JavaScript Langsung Aktif -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBox = document.getElementById('menuBox');
            const welcomeText = document.getElementById('welcomeText');
            const loginFormCard = document.getElementById('loginFormCard');
            const registerFormCard = document.getElementById('registerFormCard');
            const dashboardCard = document.getElementById('dashboardCard');
            const dashUser = document.getElementById('dashUser');

            function closeAll() {
                loginFormCard.classList.remove('active');
                registerFormCard.classList.remove('active');
                dashboardCard.classList.remove('active');
                menuBox.style.display = 'flex';
                welcomeText.style.display = 'block';
            }

            // Event listener klik tombol
            document.getElementById('loginBtn').addEventListener('click', () => {
                menuBox.style.display = 'none';
                welcomeText.style.display = 'none';
                registerFormCard.classList.remove('active');
                dashboardCard.classList.remove('active');
                loginFormCard.classList.add('active');
            });

            document.getElementById('regBtn').addEventListener('click', () => {
                menuBox.style.display = 'none';
                welcomeText.style.display = 'none';
                loginFormCard.classList.remove('active');
                dashboardCard.classList.remove('active');
                registerFormCard.classList.add('active');
            });

            document.getElementById('closeLoginBtn').addEventListener('click', closeAll);
            document.getElementById('closeRegBtn').addEventListener('click', closeAll);

            // Logika Login
            document.getElementById('submitLoginBtn').addEventListener('click', () => {
                const user = document.getElementById('loginUsername').value.trim();
                dashUser.innerText = user ? user : 'User';
                loginFormCard.classList.remove('active');
                dashboardCard.classList.add('active');
            });

            // Logika Register
            document.getElementById('submitRegBtn').addEventListener('click', () => {
                const user = document.getElementById('regUsername').value.trim();
                dashUser.innerText = user ? user : 'User';
                registerFormCard.classList.remove('active');
                dashboardCard.classList.add('active');
            });

            // Logika Logout
            document.getElementById('logoutBtn').addEventListener('click', closeAll);
        });
    </script>

</body>
</html>
