<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whydie Pall V1</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Monospace & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Style CSS Utama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- Video Header -->
        <div class="video-card">
            <video class="card-video" autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- AUTH WRAPPER (LOGIN & REGISTER) -->
        <div class="auth-wrapper" id="authWrapper">
            <div class="auth-card">
                <div class="neon-diamond"></div>
                
                <div class="brand-header">
                    <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                    <div class="brand-subtitle">Report Panel Access</div>
                </div>

                <!-- Tab Navigation -->
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">LOGIN</button>
                    <button class="auth-tab" data-tab="register">REGISTER</button>
                </div>

                <!-- FORM LOGIN -->
                <form id="loginForm" class="auth-form active">
                    <div id="loginError" class="error-msg"></div>

                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password" required>
                    </div>

                    <div class="form-group captcha-group">
                        <label class="form-label">Captcha</label>
                        <div class="captcha-box">
                            <span id="loginCaptchaCode" class="captcha-code">ABCD</span>
                            <button type="button" id="loginCaptchaRefresh" class="btn-refresh">Refresh</button>
                        </div>
                        <input type="text" id="loginCaptcha" class="form-input" placeholder="Ketik captcha di atas" required>
                    </div>

                    <button type="submit" class="submit-btn">LOGIN</button>
                    <div class="form-footer">
                        Belum punya akun? <a href="#" id="switchToRegister">Register di sini</a>
                    </div>
                </form>

                <!-- FORM REGISTER -->
                <form id="registerForm" class="auth-form">
                    <div id="regError" class="error-msg"></div>

                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="regUsername" class="form-input" placeholder="Masukkan username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="regEmail" class="form-input" placeholder="Masukkan email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="regPassword" class="form-input" placeholder="Minimal 6 karakter" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Konfirmasi Password</label>
                        <input type="password" id="regPassword2" class="form-input" placeholder="Ulangi password" required>
                    </div>

                    <div class="form-group captcha-group">
                        <label class="form-label">Captcha</label>
                        <div class="captcha-box">
                            <span id="regCaptchaCode" class="captcha-code">XYZ1</span>
                            <button type="button" id="regCaptchaRefresh" class="btn-refresh">Refresh</button>
                        </div>
                        <input type="text" id="regCaptcha" class="form-input" placeholder="Ketik captcha di atas" required>
                    </div>

                    <button type="submit" class="submit-btn">REGISTER</button>
                    <div class="form-footer">
                        Sudah punya akun? <a href="#" id="switchToLogin">Login di sini</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- DASHBOARD UTAMA (AKAN DITAMPILKAN SETELAH LOGIN) -->
        <div class="dashboard-container" id="dashboard" style="display: none;">
            
            <!-- User Info Header -->
            <div class="user-info-card">
                <div class="user-details">
                    <div>User: <strong id="userName">-</strong></div>
                    <div>ID: <span id="userId">-</span></div>
                    <div>Role: <span id="userRole">-</span></div>
                </div>
                <div class="user-stats-summary">
                    <div>Report: <strong id="reportCount">0 email</strong></div>
                    <div>Email: <strong id="emailCount">0 terdaftar</strong></div>
                    <div>Limit: <strong id="userLimit">0/5</strong></div>
                </div>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>

            <!-- Menu Grid Button -->
            <div class="menu-grid">
                <button class="neon-btn" data-menu="gmail">Gmail Manager</button>
                <button class="neon-btn" data-menu="report">Gas Report</button>
                <button class="neon-btn" data-menu="progress">Progress</button>
                <button class="neon-btn" data-menu="stats">Statistik</button>
                <button class="neon-btn" data-menu="session">Session</button>
                <button class="neon-btn" data-menu="role">Up Role</button>
                <button class="neon-btn" data-menu="limit">My Limit</button>
                <button class="neon-btn" data-menu="donasi">Donasi</button>
                <button class="neon-btn" data-menu="qris">QRIS</button>
                <button class="neon-btn" data-menu="owner">Owner</button>
                <button class="neon-btn" data-menu="akun">Cek Akun</button>
                <button class="neon-btn" data-menu="referral">Referral</button>
            </div>

            <!-- Workspace Area (Tempat Menu Berjalan) -->
            <div class="workspace-card" id="workspace">
                <div class="workspace-placeholder">
                    <p>Pilih menu di atas untuk memulai</p>
                </div>
            </div>

            <!-- Console Log Body -->
            <div class="console-card">
                <div class="console-header">
                    <span>CONSOLE LOG</span>
                    <button id="clearLog" class="btn-small">Clear</button>
                </div>
                <div class="console-body" id="consoleBody"></div>
            </div>

        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast">
            <span id="toastIcon">OK</span>
            <span id="toastMsg">Notification</span>
        </div>

        <!-- Contact Section -->
        <div class="contact-box">
            <span>Contact Us</span>
            <div class="social-icons">
                <a href="https://t.me/mrwhy016" target="_blank" class="icon-circle" title="Telegram">
                    <i class="fa-paper-plane fas"></i>
                </a>
                <a href="https://www.tiktok.com/@wildan,aj,bre" target="_blank" class="icon-circle tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 Whydie Pall
            </div>
        </div>

    </div>

    <!-- Script JavaScript Utama -->
    <script src="script.js"></script>

</body>
</html>
