<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whydie Pall V1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- Video Header -->
        <div class="video-card">
            <video class="card-video" autoplay loop muted playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Section Teks Welcome -->
        <div class="text-section" id="welcomeText">
            <h2>Welcome to Whydie Pall</h2>
            <p>Please log in or register to continue</p>
        </div>

        <!-- Menu Utama Simple -->
        <div class="menu-box" id="menuBox">
            <button class="btn-menu" onclick="openLoginForm()">Login</button>
            <button class="btn-menu" onclick="openRegisterForm()">Register</button>
        </div>

        <!-- FORM KHUSUS LOGIN -->
        <div class="form-card" id="loginFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Login Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <button type="button" class="submit-btn" onclick="handleAuth('login')">LOGIN</button>
            <button type="button" class="btn-close" onclick="closeAllForms()">&larr; Kembali ke menu utama</button>
        </div>

        <!-- FORM KHUSUS REGISTER -->
        <div class="form-card" id="registerFormCard">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Report Panel — Create Account</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="regUsername" class="form-input" placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="regPassword" class="form-input" placeholder="Masukkan password">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="regConfirmPassword" class="form-input" placeholder="Ulangi password">
            </div>

            <button type="button" class="submit-btn" onclick="handleAuth('register')">REGISTER</button>
            <button type="button" class="btn-close" onclick="closeAllForms()">&larr; Kembali ke menu utama</button>
        </div>

        <!-- PANEL DASHBOARD -->
        <div class="form-card" id="dashboardCard" style="display: none;">
            <div class="neon-diamond"></div>
            
            <div class="brand-header">
                <div class="brand-title">WHYDIE PALL <span>V1.0</span></div>
                <div class="brand-subtitle">Dashboard Panel</div>
            </div>

            <div style="text-align: center; margin-bottom: 20px; font-family: 'Inter', sans-serif;">
                <p style="font-size: 14px; color: #fff;">Selamat Datang, <span id="dashUser" style="color: #00d2ff;">User</span>!</p>
                <p style="font-size: 11px; color: #00ff88; margin-top: 5px;">Status: Active</p>
            </div>

            <button type="button" class="submit-btn" style="background: #ff4d4d; color: #fff;" onclick="closeAllForms()">LOGOUT</button>
        </div>

        <!-- Contact Section -->
        <div class="contact-box">
            <span>Contact Us</span>
            <div class="social-icons">
                <a href="https://t.me/mrwhy016" target="_blank" class="icon-circle" title="Telegram">
                    <i class="fa-paper-plane fas"></i>
                </a>
                <a href="https://www.tiktok.com/@wildan,aj,bre" target="_blank" class="icon-circle tiktok" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 Whydie Pall
            </div>
        </div>

    </div>

    <!-- Script Kontrol Interaksi -->
    <script>
        function openLoginForm() {
            document.getElementById('menuBox').style.display = 'none';
            document.getElementById('welcomeText').style.display = 'none';
            document.getElementById('registerFormCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'none';
            document.getElementById('loginFormCard').style.display = 'flex';
        }

        function openRegisterForm() {
            document.getElementById('menuBox').style.display = 'none';
            document.getElementById('welcomeText').style.display = 'none';
            document.getElementById('loginFormCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'none';
            document.getElementById('registerFormCard').style.display = 'flex';
        }

        function closeAllForms() {
            document.getElementById('loginFormCard').style.display = 'none';
            document.getElementById('registerFormCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'none';
            document.getElementById('menuBox').style.display = 'flex';
            document.getElementById('welcomeText').style.display = 'block';
        }

        function handleAuth(type) {
            let username = "";
            if (type === 'login') {
                username = document.getElementById('loginUsername').value;
            } else {
                username = document.getElementById('regUsername').value;
            }

            if (!username) {
                username = "User";
            }

            // Sembunyikan form dan tampilkan Dashboard
            document.getElementById('loginFormCard').style.display = 'none';
            document.getElementById('registerFormCard').style.display = 'none';
            document.getElementById('dashUser').innerText = username;
            document.getElementById('dashboardCard').style.display = 'flex';
        }
    </script>
</body>
</html>
